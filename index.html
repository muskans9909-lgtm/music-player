<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Music Player</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="player-container">
    <header class="player-header">
      <span>Now Playing</span>
      <button id="fav-btn" class="icon-btn" title="Favorite"><i class="far fa-heart"></i></button>
    </header>

    <!-- Vinyl Spinning Cover -->
    <div class="cover-container">
      <img src="" alt="Album Art" id="cover-art" class="cover-art">
    </div>

    <!-- Song Details -->
    <div class="song-details">
      <h3 id="song-title">Song Title</h3>
      <p id="artist-name">Artist Name</p>
    </div>

    <!-- Hidden Native Audio -->
    <audio id="audio-element"></audio>

    <!-- Progress Timeline & Seek -->
    <div class="timeline-container">
      <div class="progress-bar-bg" id="progress-container">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
      <div class="time-tags">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <!-- Core Controls + Shuffle & Repeat -->
    <div class="media-controls">
      <button class="btn icon-btn" id="shuffle-btn" title="Shuffle"><i class="fas fa-shuffle"></i></button>
      <button class="btn icon-btn" id="prev-btn" title="Previous"><i class="fas fa-backward-step"></i></button>
      <button class="btn play-btn" id="play-btn" title="Play/Pause"><i class="fas fa-play" id="play-icon"></i></button>
      <button class="btn icon-btn" id="next-btn" title="Next"><i class="fas fa-forward-step"></i></button>
      <button class="btn icon-btn" id="repeat-btn" title="Repeat"><i class="fas fa-repeat"></i></button>
    </div>

    <!-- Volume & Mute -->
    <div class="volume-container">
      <button id="mute-btn" class="icon-btn"><i class="fas fa-volume-high" id="volume-icon"></i></button>
      <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.7">
    </div>

    <!-- Playlist Section -->
    <div class="playlist-section">
      <div class="playlist-header">
        <h3>Playlist</h3>
        <span id="track-count">3 Songs</span>
      </div>
      <ul id="playlist" class="playlist-list"></ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
